name: Refresh profile card

# Refreshes the dynamic values (uptime, repos, stars, commits, followers, LOC)
# inside assets/dark_mode.svg and assets/light_mode.svg.

on:
  schedule:
    # Daily at 03:17 UTC. Off the hour on purpose: the top of the hour is the
    # most contended slot on GitHub Actions and jobs queue for longer.
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never let two runs push to the same branch at once.
  group: profile-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ascii.txt is often replaced by hand (or by a browser ASCII-art
      # converter) at whatever size the source image happened to be. Refit it
      # to the 40x30 grid the card is laid out for, then rebuild so a
      # swapped-in portrait is actually reflected in the SVG.
      - name: Fit ASCII art and rebuild SVG
        run: |
          python3 tools/fit_ascii.py
          python3 tools/build_svg.py

      # Secret is passed through the environment, never written into the repo
      # or echoed into the log. today.py reads ACCESS_TOKEN and USER_NAME.
      - name: Update card numbers
        env:
          USER_NAME: ${{ github.repository_owner }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_BIRTHDAY: "2007-09-03"
        run: python3 today.py

      # Self-check before committing: catches a malformed SVG or a missing id
      # here rather than after it is already pushed to the public profile.
      - name: Verify SVG geometry
        run: python3 tools/verify_svg.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark_mode.svg assets/light_mode.svg cache/
          if git diff --cached --quiet; then
            echo "No changes -- nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile card stats"
          git push